// ⚠️ 未在本机验证（无网络、无 Gradle）。结构照 NetMusicCanPlayBili-0.7.10-beta，
//    版本参数改为 1.21.1 + NeoForge 21.1.252。首次联网跑 gradlew 之前请核对 MDG 版本。
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    validateAccessTransformers = true
    runs {
        client { client() }
        server { server() }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}
repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
dependencies {
    // 0.7.9 的 neoforge.mods.toml 声明：netmusic 必需、curios 可选（未声明 hard dep）
    compileOnly "maven.modrinth:net-music:1.5.2-neoforge+mc1.21.1"
}
// 源码里有中文字符串字面量（例如 Config 的 comment("是否启用…")），而 options.encoding 决定
// javac 读源码用的编码。当前只是碰巧依赖 JDK 18+ 的默认 UTF-8；显式声明才不会在别的
// JDK 或区域设置下把中文字面量读坏。（注意：它不影响 javac 诊断文本的编码。）
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    // toml 目前是 jar 里的成品（src/main/resources/META-INF/neoforge.mods.toml）；
    // 若要改成 0.7.10 那种模板展开，把它移到 src/main/templates 并在这里声明 expand。
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}
